name: Validar projeto PHP

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql

      - name: Verificar sintaxe PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Executar testes de funções
        run: php testes/teste_funcoes.php
